name: Spec auto-update

# Weekly refresh of the generated uapi/ and whm/ packages against cPanel's
# official OpenAPI documents. Downloads the latest specs, regenerates with
# tools/gen/generate.py, verifies, and -- when anything changed -- commits,
# pushes a version tag, and publishes a GitHub release.
#
# Run manually with: gh workflow run "Spec auto-update"

on:
  schedule:
    # Weekly, Monday 03:17 UTC
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spec-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Fetch latest specs
        run: tools/gen/fetch-specs.sh

      - name: Read spec versions
        id: versions
        run: |
          # Convert the spec info.version into a Go-valid module tag.
          # cPanel reports 4-part versions ("11.137.9999.96") which are not
          # valid Go module tags; trailing parts become a semver prerelease
          # ("v11.137.9999-96") so `go get module@<tag>` works and versions
          # stay unique and monotonically ordered.
          to_tag() {
            python3 -c 'import sys; p=sys.argv[1].lstrip("v").split("."); c=(p+["0","0","0"])[:3]; pre="-".join(p[3:]); print("v"+".".join(c)+("-"+pre if pre else ""))' "$1"
          }
          CPANEL_VER=$(python3 -c 'import yaml;print(yaml.safe_load(open("tools/gen/cpanel.openapi.yaml"))["info"]["version"])')
          WHM_VER=$(python3 -c 'import yaml;print(yaml.safe_load(open("tools/gen/whm.openapi.yaml"))["info"]["version"])')
          echo "cpanel=$CPANEL_VER" >> "$GITHUB_OUTPUT"
          echo "whm=$WHM_VER" >> "$GITHUB_OUTPUT"
          echo "tag=$(to_tag "$CPANEL_VER")" >> "$GITHUB_OUTPUT"

      - name: Regenerate
        run: |
          python3 tools/gen/generate.py \
            tools/gen/cpanel.openapi.yaml \
            tools/gen/whm.openapi.yaml \
            . \
            --cpanel-md tools/gen/cpanel.openapi.md \
            --whm-md tools/gen/whm.openapi.md

      - name: Verify
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

      - name: Check for changes
        id: changes
        run: |
          git add -A
          git diff --cached --quiet && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate from official cPanel & WHM specs ($TAG)"
          git push origin main

      - name: Create version tag
        id: tag
        if: steps.changes.outputs.changed == 'true'
        env:
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; skipping release."
            echo "skip_release=true" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "skip_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.changes.outputs.changed == 'true' && steps.tag.outputs.skip_release == 'false'
        env:
          TAG: ${{ steps.versions.outputs.tag }}
          CPANEL_VER: ${{ steps.versions.outputs.cpanel }}
          WHM_VER: ${{ steps.versions.outputs.whm }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "cPanel & WHM v138 (specs $CPANEL_VER / $WHM_VER)" \
            --notes-file - <<EOF
          Auto-generated from the official cPanel & WHM OpenAPI documents.

          - cPanel UAPI spec version: $CPANEL_VER
          - WHM API 1 spec version: $WHM_VER
          - 1,267 typed functions (642 UAPI / 625 WHM)

          Generated by tools/gen/generate.py and verified with go build, go vet, and go test -race.
          EOF
